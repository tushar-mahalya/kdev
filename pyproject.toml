[project]
name = "kdev-cli"
version = "0.2.0"
description = "A Kaggle notebook as your remote dev box: SSH and VS Code in, files that persist across sessions, accounts and machines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["kaggle", "ssh", "vscode", "remote-development", "gpu", "cloudflare-tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
# Floors are the versions kdev is tested against (CI runs the suite on the
# lowest ones): typer 0.27.2 is the first to export `typer.TyperException`,
# questionary 2.1 is the first whose `Choice` takes a `description`, kaggle 2.2
# ships the OAuth `auth login` flow and the kagglesdk that token refresh
# depends on.
dependencies = [
    "httpx>=0.27,<1",
    "kaggle>=2.2,<3",
    "typer>=0.27.2,<1",
    "questionary>=2.1,<3",
    # The home menu is a small prompt_toolkit app of its own (questionary is
    # built on it too).
    "prompt-toolkit>=3.0.36,<4",
    "rich>=13,<16",
]

[project.urls]
Homepage = "https://kdev-cli.pages.dev"
Documentation = "https://kdev-cli.pages.dev/docs/"
Repository = "https://github.com/tushar-mahalya/kdev"
Issues = "https://github.com/tushar-mahalya/kdev/issues"
Changelog = "https://github.com/tushar-mahalya/kdev/blob/main/CHANGELOG.md"

[project.scripts]
kdev = "kdev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdev"]

# The source distribution ships the package, its tests and docs -- nothing
# else that happens to be lying in the working tree.
[tool.hatch.build.targets.sdist]
include = ["src/kdev", "tests", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
# ruff is pinned to the version .pre-commit-config.yaml runs, so a clean
# `uv run ruff` locally means a clean hook and a clean CI.
dev = ["pytest>=8", "pytest-cov>=7.1", "ruff==0.17.5", "pre-commit>=4", "basedpyright>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # the design glyphs are deliberate

# Basic mode for now: catches wrong types, misspelled attributes and
# str | None passed where str is needed, without demanding full strictness.
# kdev_box.py runs inside the Kaggle notebook with only the standard
# library, so it must never gain imports from this package at runtime.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

# Measured on the package alone, wherever `--cov` is run from. The floor sits a
# few points under the current total (74.8%), so coverage cannot drop unnoticed;
# raise it when the total rises.
[tool.coverage.run]
source = ["kdev"]

[tool.coverage.report]
fail_under = 71

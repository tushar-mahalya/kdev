# Runs on every commit (and `pytest` on every push). CI runs the same hooks,
# so what passes here passes there. Install once per clone:
#   uv run pre-commit install --install-hooks -t pre-commit -t pre-push
# New hooks below are pinned to commit SHAs (the comment names the release).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # IndexNow key file: its body must be exactly the key.
        exclude: ^website/public/[0-9a-f]{32}\.txt$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      # kdev handles OAuth tokens, tunnel credentials and deploy keys; none
      # of them may ever be committed.
      - id: detect-private-key

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.1
    hooks:
      # A mistyped key in a workflow fails silently on GitHub; catch it here.
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-citation-file-format

  # Lints workflow syntax and expressions, which check-github-workflows
  # (a schema check) does not.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Security audit of workflows: template injection, over-broad permissions,
  # persisted credentials, unpinned actions, dependabot without a cooldown.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8 # frozen: v1.33.1
    hooks:
      - id: zizmor

  # Spell check; the config is _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888 # frozen: v1.52.2
    hooks:
      - id: typos
        # Report only. The default writes its suggestions into the files, which
        # would rename identifiers that are spelled on purpose.
        args: [--force-exclude]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Pinned hook revisions in this file are 40-hex commit SHAs, which look
        # like secrets; gitleaks still scans it.
        exclude: ^(uv\.lock|website/package-lock\.json|\.pre-commit-config\.yaml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      # pyproject.toml and uv.lock must never disagree.
      - id: uv-lock

  - repo: local
    hooks:
      # The hints are checked, not merely written; config lives in pyproject.
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
